<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>手势视频控制</title>
  <!-- theme.css 是唯一的设计令牌来源（颜色 / 圆角 / 阴影 / 动效），必须排在前面 -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="float.css">
</head>
<body>
  <!-- 正常状态：悬浮窗主体 -->
  <div id="full" class="full">
    <!-- 标题栏（可拖动） -->
    <div id="titlebar" class="titlebar">
      <span class="title">
        <span class="title-logo" data-icon="logo" data-size="15"></span>手势视频控制
      </span>
      <span class="actions">
        <button id="btn-theme" type="button" data-theme-toggle data-size="15" title="切换主题"></button>
        <button id="btn-preview" data-icon="eye" data-size="15" title="显示 / 隐藏摄像头画面"></button>
        <button id="btn-min" data-icon="minus" data-size="15" title="最小化为悬浮球"></button>
        <button id="btn-close" data-icon="close" data-size="15" title="关闭悬浮窗（识别继续后台运行）"></button>
      </span>
    </div>

    <!-- 摄像头预览（画面来自后台识别引擎，可选择隐藏） -->
    <div class="preview-wrap">
      <video id="preview" autoplay muted playsinline></video>
      <canvas id="overlay" class="overlay"></canvas>
      <div id="preview-placeholder" class="preview-placeholder">正在打开摄像头预览…</div>
    </div>

    <!-- 状态与控制 -->
    <div class="body">
      <div class="gesture-row">
        <span id="gesture-emoji" class="gesture-emoji">🖐️</span>
        <div class="gesture-info">
          <span class="label">当前手势</span>
          <span id="gesture-name" class="gesture-name">等待识别…</span>
          <span id="gesture-detail" class="gesture-detail"></span>
        </div>
      </div>

      <div id="model-status" class="status">正在连接后台识别…</div>
      <div id="video-status" class="status">正在检测当前页面…</div>

      <label class="switch-row">
        <span class="switch-label">手势控制</span>
        <input type="checkbox" id="control-toggle">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>

      <label class="switch-row">
        <span class="switch-label">短视频模式（食指=滑动刷视频）</span>
        <input type="checkbox" id="short-toggle">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>

      <button id="grant-button" class="grant-button" hidden>
        <span data-icon="camera" data-size="14"></span><span>在标签页中授权摄像头</span>
      </button>
    </div>
  </div>

  <!-- 最小化后的悬浮球（点击恢复） -->
  <div id="pill" class="pill" hidden>
    <span id="pill-icon" class="pill-icon" data-icon="logo" data-size="26"></span>
  </div>

  <!-- 页面内识别用的独立摄像头流（保持渲染，最小化/隐藏预览也不影响识别） -->
  <video id="rec-video" autoplay muted playsinline
         style="position:fixed;top:-10000px;left:-10000px;width:320px;height:240px;"></video>

  <!-- 手势分类逻辑 -->
  <script src="gesture.js"></script>
  <!-- 内联 SVG 图标集（把 data-icon 占位填成图标） -->
  <script src="ui-icons.js"></script>
  <!-- 主题模式（跟随系统 / 深色 / 浅色） -->
  <script src="theme-mode.js"></script>
  <!-- 悬浮窗控制器（ES Module：从本地 vision_bundle.mjs 引入 MediaPipe） -->
  <script type="module" src="float.js"></script>
</body>
</html>
