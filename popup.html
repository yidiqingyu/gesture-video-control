<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手势视频控制</title>
  <!-- theme.css 是唯一的设计令牌来源（颜色 / 圆角 / 阴影 / 动效），必须排在前面 -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- 顶部标题 -->
  <header class="header">
    <span class="logo" data-icon="logo" data-size="19"></span>
    <div class="header-text">
      <h1>手势视频控制</h1>
      <p class="subtitle">B 站 / YouTube / 任意网页视频</p>
    </div>
    <!-- 主题切换：跟随系统 / 深色 / 浅色（图标与提示由 theme-mode.js 渲染） -->
    <button id="theme-toggle" class="icon-button" type="button" data-theme-toggle data-size="16" title="切换主题"></button>
  </header>

  <!-- 后台识别预览（画面来自离屏文档，弹窗关闭后识别仍在后台运行） -->
  <div class="camera-wrap">
    <video id="preview" autoplay muted playsinline></video>
    <div id="camera-placeholder" class="camera-placeholder">打开「手势控制」后显示画面</div>
    <div id="camera-resize" class="camera-resize" title="拖动调整画面大小"></div>
  </div>

  <button id="grant-button" class="grant-button" hidden>
    <span data-icon="camera" data-size="15"></span><span>在标签页中授权摄像头</span>
  </button>
  <button id="open-float" class="open-float">
    <span data-icon="panel" data-size="15"></span><span>打开悬浮面板</span>
  </button>

  <!-- 当前手势 -->
  <div class="gesture-row">
    <span id="gesture-emoji" class="gesture-emoji">🖐️</span>
    <div class="gesture-info">
      <span class="label">当前手势</span>
      <span id="gesture-name" class="gesture-name">等待识别…</span>
      <span id="gesture-detail" class="gesture-detail"></span>
    </div>
  </div>

  <!-- 模型 / 页面状态 -->
  <div id="model-status" class="status">正在连接后台识别…</div>
  <div id="video-status" class="status">正在检测当前页面…</div>
  <!-- 自检状态（后台每分钟自检一次，异常时这里会说明） -->
  <div id="health-status" class="status" hidden></div>

  <!-- 开关 -->
  <label class="switch-row">
    <span class="switch-label">手势控制</span>
    <input type="checkbox" id="control-toggle">
    <span class="switch-track"><span class="switch-thumb"></span></span>
  </label>

  <label class="switch-row">
    <span class="switch-label">短视频模式（食指=滑动刷视频）</span>
    <input type="checkbox" id="short-toggle">
    <span class="switch-track"><span class="switch-thumb"></span></span>
  </label>

  <!-- 手势对照表（点击展开，内容由 gesture-catalog.js 提供） -->
  <button id="gesture-help" class="gesture-help" aria-expanded="false">
    <span data-icon="book" data-size="15"></span><span id="gesture-help-label">手势对照表</span>
  </button>
  <div id="gesture-help-body" class="gesture-help-body" hidden></div>

  <div class="hint">
    <span class="hint-icon" data-icon="info" data-size="14"></span>
    <div class="hint-text">
      识别在<strong>后台</strong>运行：开启后可关闭本弹窗，不影响手势控制。<br>
      摄像头使用时，工具栏会显示相机使用指示。<br>
      摄像头画面仅在本机处理，不会上传。<br>
      手掌张开保持 <strong>2 秒</strong>，可随时切换长/短视频模式。
    </div>
  </div>

  <!-- 弹窗只负责遥控与状态显示；识别引擎在 offscreen.html 中运行 -->
  <script src="gesture-catalog.js"></script>
  <script src="ui-icons.js"></script>
  <script src="theme-mode.js"></script>
  <script src="popup.js"></script>
</body>
</html>
