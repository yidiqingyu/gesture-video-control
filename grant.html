<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>授权摄像头</title>
  <!-- theme.css 是唯一的设计令牌来源（颜色 / 圆角 / 阴影 / 动效） -->
  <link rel="stylesheet" href="theme.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--gvc-bg);
      background-image: radial-gradient(60% 50% at 50% 0%, var(--gvc-accent-soft), transparent 62%);
      background-repeat: no-repeat;
      font-family: var(--gvc-font);
      color: var(--gvc-text);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 380px;
      max-width: calc(100vw - 32px);
      padding: 28px 26px 26px;
      text-align: center;
      background: var(--gvc-surface);
      border: 1px solid var(--gvc-line);
      border-radius: var(--gvc-radius-lg);
      box-shadow: var(--gvc-shadow-lg), var(--gvc-hairline);
    }
    .logo {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      margin: 0 auto 14px;
      border-radius: 14px;
      color: var(--gvc-on-accent);
      background-image: linear-gradient(150deg, var(--gvc-accent-hi), var(--gvc-accent));
      box-shadow: 0 12px 26px -10px var(--gvc-accent-glow), var(--gvc-hairline);
    }
    .logo .gvc-icon { display: block; }
    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .01em;
    }
    p {
      margin: 10px 0 0;
      font-size: 13px;
      line-height: 1.7;
      color: var(--gvc-text-dim);
    }
    p.ok { color: var(--gvc-ok-text); }
    p.err { color: var(--gvc-err-text); }
    button {
      margin-top: 18px;
      padding: 10px 22px;
      border: none;
      border-radius: var(--gvc-radius-sm);
      color: var(--gvc-on-accent);
      background-image: linear-gradient(180deg, var(--gvc-accent-hi), var(--gvc-accent));
      box-shadow: 0 10px 22px -12px var(--gvc-accent-glow), var(--gvc-hairline);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: filter var(--gvc-fast) var(--gvc-ease), transform var(--gvc-fast) var(--gvc-ease);
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }
    button[hidden] { display: none; }
    :focus-visible { outline: 2px solid var(--gvc-accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="logo" data-icon="camera" data-size="24"></span>
    <h1>授权摄像头</h1>
    <p id="msg">正在请求摄像头权限，请在浏览器提示中选择「允许」…</p>
    <button id="done" hidden>已完成，关闭此页面</button>
  </div>
  <script src="ui-icons.js"></script>
  <script src="theme-mode.js"></script>
  <script src="grant.js"></script>
</body>
</html>
