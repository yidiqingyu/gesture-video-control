<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>授权摄像头</title>
  <style>
    body {
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: #101826;
      color: #e8eef7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { font-size: 24px; }
    p { font-size: 15px; color: #b9c7dd; text-align: center; max-width: 420px; line-height: 1.7; }
    button {
      margin-top: 18px;
      padding: 10px 26px;
      border: none;
      border-radius: 10px;
      background: #1f6feb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>🖐️ 授权摄像头</h1>
  <p id="msg">正在请求摄像头权限，请在浏览器提示中选择「允许」…</p>
  <button id="done" hidden>✅ 已完成，关闭此页面</button>
  <script src="grant.js"></script>
</body>
</html>
